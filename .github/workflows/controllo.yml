name: Controllo disponibilita Sun Bay

on:
  schedule:
    # Ogni 15 minuti (GitHub puo' avere qualche minuto di ritardo nei picchi di traffico)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # permette anche di avviarlo manualmente dal sito, per fare un test

permissions:
  contents: write   # serve per poter salvare il file dello stato nel repository

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le librerie
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Esegui il controllo
        run: python monitor.py

      - name: Salva lo stato aggiornato nel repository
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add stato_date_disponibili.json
          git diff --quiet --cached || git commit -m "Aggiorna stato date disponibili"
          git push
