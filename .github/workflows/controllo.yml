name: Controllo disponibilita Sun Bay

on:
  workflow_dispatch: {}   # avviato da cron-job.org (esterno) e/o manualmente dal sito

# Se parte una nuova esecuzione mentre una precedente e' ancora in corso,
# cancelliamo quella vecchia e facciamo partire subito la piu' recente.
# (Ogni controllo e' indipendente: non serve completare quelli "vecchi" in coda,
# meglio avere sempre il dato piu' fresco possibile)
concurrency:
  group: controllo-sun-bay
  cancel-in-progress: true

permissions:
  contents: write   # serve per poter salvare il file dello stato nel repository

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le librerie
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Esegui il controllo
        run: python monitor.py

      - name: Carica lo screenshot dell'errore (solo se qualcosa e' andato storto)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: errore-screenshot
          path: errore_screenshot.png
          retention-days: 7

      - name: Salva lo stato aggiornato nel repository
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add stato_date_disponibili.json
          git diff --quiet --cached || git commit -m "Aggiorna stato date disponibili"
          git pull --rebase --autostash || true
          git push
