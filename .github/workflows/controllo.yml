name: Controllo disponibilita Sun Bay

on:
  workflow_dispatch: {}   # avviato da cron-job.org (esterno) e/o manualmente dal sito

# Se un controllo e' gia' in corso quando arriva un nuovo trigger, lo lasciamo
# FINIRE (potrebbe essere proprio quello a rilevare un'apertura, non ha senso
# interromperlo sul piu' bello). I trigger che arrivano nel frattempo si mettono
# in coda, ma GitHub tiene automaticamente solo l'ultimo arrivato: non si
# accumula comunque un arretrato di controlli "vecchi".
concurrency:
  group: controllo-sun-bay
  cancel-in-progress: false

permissions:
  contents: write   # serve per poter salvare il file dello stato nel repository

jobs:
  controlla:
    runs-on: ubuntu-latest
    # Immagine ufficiale Microsoft con Chromium e tutte le sue dipendenze
    # di sistema GIA' installate: elimina il passaggio piu' lento (~1-2 minuti)
    # di scaricare/installare il browser ad ogni esecuzione.
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble

    steps:
      - name: Installa git (non incluso nell'immagine Playwright)
        run: |
          apt-get update -qq
          apt-get install -y -qq git

      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Installa le librerie Python
        run: pip install -r requirements.txt --quiet

      - name: Esegui il controllo
        run: python monitor.py

      - name: Carica lo screenshot dell'errore (solo se qualcosa e' andato storto)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: errore-screenshot
          path: errore_screenshot.png
          retention-days: 7

      - name: Salva lo stato aggiornato nel repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add stato_date_disponibili.json
          git diff --quiet --cached || git commit -m "Aggiorna stato date disponibili"
          git pull --rebase --autostash || true
          git push
